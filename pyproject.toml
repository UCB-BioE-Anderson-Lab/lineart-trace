[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lineart-trace"
version = "0.2.0"
description = "Centreline vectorisation of line art into SVG cubic Beziers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "J. Christopher Anderson" }]
keywords = ["svg", "vectorisation", "line art", "centreline", "bezier",
            "skeleton", "tracing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.21", "opencv-python>=4.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Source = "https://github.com/UCB-BioE-Anderson-Lab/lineart-trace"

[project.scripts]
lineart-trace = "lineart_trace.cli:main"

[tool.setuptools.packages.find]
include = ["lineart_trace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
