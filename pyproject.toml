[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lineart-trace"
version = "0.1.0"
description = "Centreline vectorisation of line art into SVG cubic Beziers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.21", "opencv-python>=4.5"]

[project.scripts]
lineart-trace = "lineart_trace.cli:main"

[tool.setuptools.packages.find]
include = ["lineart_trace*"]
